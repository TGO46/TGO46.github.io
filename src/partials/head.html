<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="tone-daylight" color-interpolation-filters="sRGB" x="0" y="0" width="100%" height="100%">
      <feComponentTransfer>
        <feFuncR type="gamma" amplitude="1" exponent=".92" offset="0"/>
        <feFuncG type="gamma" amplitude="1" exponent=".92" offset="0"/>
        <feFuncB type="gamma" amplitude="1" exponent=".92" offset="0"/>
      </feComponentTransfer>
      <feColorMatrix type="saturate" values="1.045"/>
    </filter>
    <filter id="tone-shade" color-interpolation-filters="sRGB" x="0" y="0" width="100%" height="100%">
      <feComponentTransfer>
        <feFuncR type="gamma" amplitude="1" exponent=".82" offset="0"/>
        <feFuncG type="gamma" amplitude="1" exponent=".82" offset="0"/>
        <feFuncB type="gamma" amplitude="1" exponent=".82" offset="0"/>
      </feComponentTransfer>
      <feColorMatrix type="saturate" values="1.09"/>
    </filter>
    <filter id="tone-backlit" color-interpolation-filters="sRGB" x="0" y="0" width="100%" height="100%">
      <feComponentTransfer>
        <feFuncR type="gamma" amplitude="1" exponent=".69" offset="0"/>
        <feFuncG type="gamma" amplitude="1" exponent=".69" offset="0"/>
        <feFuncB type="gamma" amplitude="1" exponent=".69" offset="0"/>
      </feComponentTransfer>
      <feColorMatrix type="saturate" values="1.12"/>
    </filter>
  </defs>
